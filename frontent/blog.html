<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs | Indira Gandhi Engineering College</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <nav aria-label="Main menu">
        <a href="home.html">Home</a>
        <a href="login.html">Student Login</a>
        <a href="Registration.html">Registration</a>
        <a href="blog.html" aria-current="page">Blog</a>
        <a href="about.html">About</a>
    </nav>

    <section>
        <h2>Create Blog</h2>
        <form id="blog-form">
            <label for="title">Title</label>
            <input type="text" id="title" required>

            <label for="content">Content</label>
            <textarea id="content" rows="6" required></textarea>

            <button type="submit">Publish</button>
        </form>
        <p id="msg"></p>

        <h2>All Blogs</h2>
        <div id="blogs"></div>
    </section>

    <script>
        const API = "http://localhost:5000/api";
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        async function loadBlogs() {
            const res = await fetch(`${API}/blogs`);
            const blogs = await res.json();
            const box = document.getElementById("blogs");
            box.innerHTML = "";
            blogs.forEach((b) => {
                const div = document.createElement("div");
                const h = document.createElement("h3");
                const a = document.createElement("a");
                const p = document.createElement("p");
                const small = document.createElement("small");
                h.href = 'blog-detail.html?id=${b._id}';
                p.textContent = b.title;
                h.appendChild(a);
                p.textContent = b.content.length > 150 ? b.content.slice(0, 150) + "..." : b.content;
                small.textContent = `By ${b.author?.name || "Unknown"} • ${new Date(b.createdAt).toLocaleDateString()}`;
                div.append(h, p, small);
                box.appendChild(div);
            });
        }

        document.getElementById("blog-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("msg");
            const res = await fetch(`${API}/blogs`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`,
                },
                body: JSON.stringify({
                    title: document.getElementById("title").value,
                    content: document.getElementById("content").value,
                }),
            });
            const result = await res.json();
            msg.textContent = result.message;
            if (res.ok) {
                e.target.reset();
                loadBlogs();
            }
        });

        loadBlogs();
    </script>
</body>
</html>
